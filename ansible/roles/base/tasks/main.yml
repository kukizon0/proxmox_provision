---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Generate locale
  community.general.locale_gen:
    name: "{{ base_locale }}"
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Install and start qemu-guest-agent
  when: base_install_guest_agent | bool
  block:
    - name: Install qemu-guest-agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present

    - name: Start qemu-guest-agent
      ansible.builtin.systemd_service:
        name: qemu-guest-agent
        state: started
        enabled: true

- name: Add ~/.local/bin to PATH for {{ dev_user }}
  ansible.builtin.blockinfile:
    path: "{{ dev_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED: local bin"
    block: |
      case ":$PATH:" in
        *":$HOME/.local/bin:"*) ;;
        *) export PATH="$HOME/.local/bin:$PATH" ;;
      esac
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0644"
    create: true
