---
- name: Collect public keys
  vars:
    # 作業端末 (コントローラー) 上に存在するファイルだけを読む
    found_files: "{{ query('ansible.builtin.fileglob', *(ssh_authorized_key_files | map('expanduser'))) }}"
  ansible.builtin.set_fact:
    ssh_keys_all: "{{ query('ansible.builtin.file', *found_files) + ssh_authorized_keys }}"

- name: Fail if no public key is configured
  ansible.builtin.assert:
    that: ssh_keys_all | length > 0
    fail_msg: >-
      公開鍵が 1 つも見つかりません。ssh_authorized_key_files か ssh_authorized_keys を設定してください。

- name: Register authorized keys for {{ dev_user }}
  ansible.posix.authorized_key:
    user: "{{ dev_user }}"
    key: "{{ ssh_keys_all | map('trim') | join('\n') }}"
    exclusive: "{{ ssh_authorized_keys_exclusive }}"
    state: present

- name: Configure sshd
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-ansible-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
